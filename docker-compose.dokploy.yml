# For servers managed by Dokploy: Traefik already owns ports 80/443, so there is no Caddy here.
# In Dokploy, create a Compose service pointing at this file, set the env vars below in its
# Environment tab, then add the domain under Domains (service "app", port 3000, HTTPS on).
services:
  app:
    build: .
    restart: unless-stopped
    environment:
      DATABASE_URL: postgres://portfolio:${POSTGRES_PASSWORD}@db:5432/portfolio
      SESSION_SECRET: ${SESSION_SECRET}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-rickmff@gmail.com}
      CONTENT_API_TOKEN: ${CONTENT_API_TOKEN}
      GOOGLE_BOOKS_API_KEY: ${GOOGLE_BOOKS_API_KEY:-}
      GITHUB_TOKEN: ${GITHUB_TOKEN:-}
      SITE_URL: https://${DOMAIN}
    volumes:
      - uploads:/app/uploads
    expose:
      - "3000"
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: portfolio
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: portfolio
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U portfolio"]
      interval: 5s
      retries: 10

volumes:
  pgdata:
  uploads:
