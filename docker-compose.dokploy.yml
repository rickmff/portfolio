# For servers managed by Dokploy: Traefik already owns ports 80/443, so there is no Caddy here.
# In Dokploy, create a Compose service pointing at this file, set the env vars below in its
# Environment tab, then add the domain under Domains (service "app", port 3000, HTTPS on).
services:
  app:
    build: .
    restart: unless-stopped
    environment:
      # Turso when set; otherwise a SQLite file in the data volume.
      TURSO_DATABASE_URL: ${TURSO_DATABASE_URL:-}
      TURSO_AUTH_TOKEN: ${TURSO_AUTH_TOKEN:-}
      SESSION_SECRET: ${SESSION_SECRET}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-rickmff@gmail.com}
      CONTENT_API_TOKEN: ${CONTENT_API_TOKEN}
      GOOGLE_BOOKS_API_KEY: ${GOOGLE_BOOKS_API_KEY:-}
      GITHUB_TOKEN: ${GITHUB_TOKEN:-}
      SITE_URL: https://${DOMAIN}
    volumes:
      - uploads:/app/uploads
      - data:/app/data
    expose:
      - "3000"

volumes:
  # Old Postgres data, kept so `docker compose down` never drops it; unused since the move to Turso.
  pgdata:
  data:
  uploads:
