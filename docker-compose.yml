services:
  app:
    build: .
    restart: unless-stopped
    environment:
      # Turso when set; otherwise a SQLite file in the data volume.
      TURSO_DATABASE_URL: ${TURSO_DATABASE_URL:-}
      TURSO_AUTH_TOKEN: ${TURSO_AUTH_TOKEN:-}
      SESSION_SECRET: ${SESSION_SECRET}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-rickmff@gmail.com}
      CONTENT_API_TOKEN: ${CONTENT_API_TOKEN}
      GOOGLE_BOOKS_API_KEY: ${GOOGLE_BOOKS_API_KEY:-}
      GITHUB_TOKEN: ${GITHUB_TOKEN:-}
      SITE_URL: https://${DOMAIN}
    volumes:
      - uploads:/app/uploads
      - data:/app/data

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      DOMAIN: ${DOMAIN}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - app

volumes:
  # Old Postgres data, kept so `docker compose down` never drops it; unused since the move to Turso.
  pgdata:
  data:
  uploads:
  caddy_data:
  caddy_config:
